<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoreboard display</title>
  <link rel="stylesheet" href="../shared/board.css">
  <link rel="stylesheet" href="spectator.css">
</head>
<body>
  <main id="canvas" aria-label="Scoreboard">
    <div id="safe-area" aria-hidden="true"></div>
    <section id="game-board" hidden></section>
    <section id="event-board" hidden>
      <p class="phase" id="event-phase" data-field="clocks.event.phase"></p>
      <p class="event-title" data-field="clocks.event.title"></p>
      <p class="event-clock" data-field="clocks.event.display"></p>
      <p class="warmup" id="warmup">Warmup follows: <span data-field="clocks.event.warmup_follows"></span></p>
    </section>
  </main>
  <script src="../shared/render.js"></script>
  <script src="../shared/board.js"></script>
  <script src="spectator.js"></script>
</body>
</html>
