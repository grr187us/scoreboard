<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoreboard display</title>
  <link rel="stylesheet" href="../shared/board.css">
  <link rel="stylesheet" href="spectator.css">
  <link rel="stylesheet" href="cutscene.css">
  <link rel="stylesheet" href="cutscenes/tigers.css">
  <link rel="stylesheet" href="cutscenes/crowd.css">
</head>
<body>
  <main id="canvas" aria-label="Scoreboard">
    <section id="game-board" hidden></section>
    <!-- The score stays on the wall through pregame and halftime: the event
         screen (schema v3, scoreboard.presentation.layout) carries its own
         home_name/home_score/away_name/away_score widgets alongside the
         countdown, so the stadium's one scoreboard never goes blank for a
         whole intermission. Both sections below are built and filled by
         board.js/spectator.js, same as the in-game board always was. -->
    <section id="event-board" hidden></section>
    <!-- The cutscene stage. Empty and hidden whenever no cutscene is playing.
         cutscene.js places it (inline left/top/width/height, from the
         program's `stage` rectangle), shows it, and mounts one scene inside
         it; the boards underneath keep updating from applyView the whole
         time, so the bar's clock never stops while the stage is up. -->
    <section id="cutscene-stage" hidden aria-hidden="true"></section>
    <!-- The one interactive element this page has ever had. Hidden until the
         pointer moves (spectator.js); Esc and a click both close *only this
         window* and change no game state (D-005) -- it sends no bridge
         command of any kind, which is what "control-free" means for the
         source-contract tests that scan this file. -->
    <button type="button" id="close-display" class="close-display" hidden
      aria-label="Close this display window">✕ CLOSE DISPLAY (Esc)</button>
  </main>
  <script src="../shared/render.js"></script>
  <script src="../shared/board.js"></script>
  <script src="spectator.js"></script>
  <script src="cutscenes/builtin.js"></script>
  <script src="cutscenes/tigers.js"></script>
  <script src="cutscenes/crowd.js"></script>
  <script src="cutscene.js"></script>
</body>
</html>
