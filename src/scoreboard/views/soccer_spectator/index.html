<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soccer scoreboard display</title>
  <link rel="stylesheet" href="../shared/board.css">
  <link rel="stylesheet" href="soccer_spectator.css">
  <link rel="stylesheet" href="../spectator/cutscene.css">
  <link rel="stylesheet" href="cutscenes/soccer.css">
</head>
<body>
  <main id="canvas" aria-label="Soccer scoreboard">
    <section id="game-board" hidden></section>
    <!-- The score stays on the wall through pregame and halftime: the event
         screen (schema v3, scoreboard.presentation.layout -- soccer reuses
         football's event registry unchanged, spec section 5.1) carries its
         own home_name/home_score/away_name/away_score widgets alongside the
         countdown, so the field's one scoreboard never goes blank for a
         whole intermission. Both sections below are built and filled by
         board.js/soccer_spectator.js, same as football's spectator page. -->
    <section id="event-board" hidden></section>
    <!-- The cutscene stage. Empty and hidden whenever no cutscene is playing.
         cutscene.js (football's, unchanged and reused) places it (inline
         left/top/width/height, from the program's `stage` rectangle), shows
         it, and mounts one scene inside it; the boards underneath keep
         updating from applyView the whole time, so the bar's clock never
         stops while the stage is up. -->
    <section id="cutscene-stage" hidden aria-hidden="true"></section>
    <!-- The one interactive element this page has ever had. Hidden until the
         pointer moves (soccer_spectator.js); Esc and a click both close
         *only this window* and change no game state -- it sends no bridge
         command of any kind, which is what "control-free" means for the
         source-contract tests that scan this file. -->
    <button type="button" id="close-display" class="close-display" hidden
      aria-label="Close this display window">✕ CLOSE DISPLAY (Esc)</button>
  </main>
  <script src="../shared/render.js"></script>
  <script src="../shared/board.js"></script>
  <script src="soccer_spectator.js"></script>
  <script src="cutscenes/soccer.js"></script>
  <script src="../spectator/cutscene.js"></script>
</body>
</html>
