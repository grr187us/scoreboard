<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cutscenes</title>
  <link rel="stylesheet" href="../shared/base.css">
  <link rel="stylesheet" href="cutscenes.css">
</head>
<body>
  <!--
    A small persistent trigger panel, like the Field Assistant: it sits beside
    the operator window all game and does one thing -- play a cutscene on the
    wall. There is no Command here and no revision; the bridge is the small
    CutscenesBridge (get_snapshot/state/trigger/cancel/rescan/select_pack/
    open_folder) described in .scratch/cutscenes/spec.md section 4.

    There is no home/away choice (cutscenes v2, .scratch/cutscenes-v2/spec.md
    section 2.5): the wall is the Tigers' wall, so a first down, a touchdown,
    a turnover, and the crowd prompt are always theirs and a penalty is
    nobody's. One button per event (five since cutscenes v3,
    .scratch/cutscenes-v3/spec.md section 2.4), and the event alone tells
    Python which side it is for.
  -->
  <header class="topbar">
    <strong>CUTSCENES</strong>
    <span id="status" class="status">Ready</span>
    <button type="button" id="cancel" class="cancel" disabled>CANCEL</button>
  </header>

  <p id="notice" class="notice" role="status" aria-live="polite"></p>

  <main class="triggers">
    <button type="button" id="trigger-first-down" class="trigger trigger-first-down" data-event="first_down">FIRST DOWN</button>
    <button type="button" id="trigger-touchdown" class="trigger trigger-touchdown" data-event="touchdown">TOUCHDOWN</button>
    <button type="button" id="trigger-turnover" class="trigger trigger-turnover" data-event="turnover">TURNOVER</button>
    <button type="button" id="trigger-penalty" class="trigger trigger-penalty" data-event="penalty">PENALTY</button>
    <button type="button" id="trigger-make-some-noise" class="trigger trigger-make-some-noise" data-event="make_some_noise">MAKE SOME NOISE</button>
  </main>

  <details class="packs" id="packs">
    <summary>Packs</summary>
    <label class="pack-row">First down
      <select data-pack-for="first_down" aria-label="First down pack"></select>
    </label>
    <label class="pack-row">Touchdown
      <select data-pack-for="touchdown" aria-label="Touchdown pack"></select>
    </label>
    <label class="pack-row">Turnover
      <select data-pack-for="turnover" aria-label="Turnover pack"></select>
    </label>
    <label class="pack-row">Penalty
      <select data-pack-for="penalty" aria-label="Penalty pack"></select>
    </label>
    <label class="pack-row">Make some noise
      <select data-pack-for="make_some_noise" aria-label="Make some noise pack"></select>
    </label>
    <div class="pack-actions">
      <button type="button" id="rescan">Rescan</button>
      <button type="button" id="open-folder">Open folder</button>
    </div>
    <ul id="issues" class="issues" hidden></ul>
  </details>

  <script src="cutscenes.js"></script>
</body>
</html>
