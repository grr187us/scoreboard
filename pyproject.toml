[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scoreboard"
version = "0.0.0"
description = "Phase 2 Task 1 Windows multi-window runtime proof"
requires-python = "==3.11.*"
dependencies = [
    "bottle==0.13.4",
    "cffi==2.1.1",
    "clr_loader==0.3.1",
    "proxy_tools==0.1.0",
    "pycparser==3.0",
    "pywebview==6.2.1",
    "pythonnet==3.1.0",
    "typing_extensions==4.16.0",
]

[project.scripts]
scoreboard-proof = "scoreboard.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scoreboard = ["views/**/*.html"]
